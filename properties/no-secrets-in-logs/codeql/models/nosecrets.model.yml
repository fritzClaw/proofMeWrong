# Models-as-data for the trusted library `nosecrets` (INTENT.md §3.6).
# They make CodeQL's rust/cleartext-logging agree with the proof about where
# logging and declassification happen:
# - the audit log is a log sink;
# - declassifiers are barriers (their results are allowed in the log);
# - deliver is a barrier: handing a secret to the user is not logging.
# Project-specific declassifiers (schema::last_n_*) are generated by
# codegen/gen_codeql_models.py into generated/.
extensions:
  - addsTo:
      pack: codeql/rust-all
      extensible: sinkModel
    data:
      - ["<nosecrets::output::audit::Entry>::new", "Argument[0]", "log-injection", "manual"]
      - ["<nosecrets::output::audit::Entry>::field", "Argument[1]", "log-injection", "manual"]
  - addsTo:
      pack: codeql/rust-all
      extensible: barrierModel
    data:
      - ["nosecrets::declassify::known_identifier", "ReturnValue", "log-injection", "manual"]
      - ["nosecrets::declassify::len", "ReturnValue", "log-injection", "manual"]
      - ["nosecrets::crypto::keyed_hash", "ReturnValue", "log-injection", "manual"]
      - ["nosecrets::crypto::digest", "ReturnValue", "log-injection", "manual"]
      - ["nosecrets::crypto::password_hash", "ReturnValue", "log-injection", "manual"]
      - ["<nosecrets::output::deliver::Line>::secret", "Argument[0]", "log-injection", "manual"]
      - ["<nosecrets::output::deliver::Line>::public", "Argument[0]", "log-injection", "manual"]
