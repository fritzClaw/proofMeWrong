# Gate test suite for no-secrets-in-logs (INTENT.md §3.7).
#
# Every negative case is a flow channel or a way around the proof. Sources:
# - "codeql-sink":  a sink of rust/cleartext-logging (codeql/rust-all
#                   frameworks/log.model.yml and stdlib models)
# - "codeql-step":  a taint step CodeQL follows (formatting, conversion,
#                   containers, closures, traits)
# - "bypass":       a way around the type/proof discipline of this package
# - "protected":    tampering with protected paths
# - "spec-gap":     a wrong classification (out of scope for the proof; only
#                   CodeQL can notice)
#
# Fields: body (statements inside `case`, the audit entry `e` is open),
# items (items inside verus!), outside (code after the verus! block),
# ops (file operations for protected cases), classification_patch and
# skeleton_patch (pairs of [old, new]) for spec-gap cases.
# `{S}` in body is replaced by a secret variable (default `password`); cases
# with `mutation = true` are also used by tests/mutate.py on generated apps.
#
# Available in `case`: hk: &HashKey, user: Public, email: Secret<Email>,
# password: Secret<Password>, identifier: Secret<Identifier>,
# key: Secret<ApiKey>, pin: Secret<Pin>, e: audit::Entry (mut).

# ---------------------------------------------------------------- sinks

[[case]]
id = "A01-println"
source = "codeql-sink std::io::stdio::_print"
expect = "reject"
mutation = true
body = '''println!("{}", {S});'''

