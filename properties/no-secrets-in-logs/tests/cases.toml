# ----------------------------------------------------- protected paths

[[case]]
id = "X01-relax-ban-list"
source = "protected: clippy.toml"
expect = "reject"
body = '''println!("hello");'''
ops = [["write", "clippy.toml", "# emptied by agent\n"]]

[[case]]
id = "X02-add-dependency"
source = "protected: app/Cargo.toml (and cargo-deny allowlist)"
expect = "reject"
body = '''e.field("k", &Public::lit("x"));'''
ops = [["append", "app/Cargo.toml", "log = \"0.4\"\n"]]

[[case]]
id = "X03-modify-trusted-library"
source = "protected: trusted/nosecrets"
expect = "reject"
body = '''e.field("k", &Public::lit("x"));'''
ops = [["append", "trusted/nosecrets/src/lib.rs", "\npub fn expose<K: Kind>(s: &Secret<K>) -> String { String::new() }\n"]]

[[case]]
id = "X04-build-script"
source = "protected: files outside app/src"
expect = "reject"
body = '''e.field("k", &Public::lit("x"));'''
ops = [["write", "app/build.rs", "fn main() {}\n"]]

[[case]]
id = "X05-modify-classification"
source = "protected: classification hash"
expect = "reject"
body = '''e.field("n", &declassify::len(&password));'''
ops = [["replace", "classification.toml", "views = [\"password_hash\", \"check\"]", "views = [\"password_hash\", \"check\", \"len\"]"]]

# ------------------------------------------------------------- spec gap

[[case]]
id = "D01-password-classified-public"
source = "spec-gap: classification labels a password as public"
expect = "reject"
only_codeql_expected = true
classification_patch = [[
  '''{ name = "password", label = "secret", kind = "password" },
  { name = "identifier", label = "secret", kind = "identifier" },''',
  '''{ name = "password", label = "public" },
  { name = "identifier", label = "secret", kind = "identifier" },''',
]]
skeleton_patch = [["password: Secret<Password>,", "password: Public,"]]
body = '''e.field("password", &password);'''

# ------------------------------------------------------------- positives

[[case]]
id = "Y01-public-field"
source = "positive: public command argument"
expect = "accept"
body = '''e.field("user", &user);'''

[[case]]
id = "Y02-last-n-after-check"
source = "positive: precondition proven by a format check"
expect = "accept"
body = '''if declassify::is_hex(&key, 32) {
        e.field("key_last4", &schema::last_n_api_key(&key));
    }'''

[[case]]
id = "Y03-known-identifier-after-match"
source = "positive: R7.4-style rule"
expect = "accept"
body = '''if declassify::eq_public(&identifier, &user) {
        e.field("identifier", &declassify::known_identifier(&identifier, &user));
    } else {
        e.field("identifier", &Public::lit("<unknown>"));
    }'''

[[case]]
id = "Y04-keyed-hash"
source = "positive: correlation without content"
expect = "accept"
body = '''e.field("email_ref", &crypto::keyed_hash(hk, &email));'''

[[case]]
id = "Y05-deliver"
source = "positive: deliverable secret to the user"
expect = "accept"
body = '''let mut l = deliver::Line::new(); l.secret(&key); deliver::emit(l);'''

[[case]]
id = "Y06-len-granted"
source = "positive: granted len view"
expect = "accept"
body = '''e.field("pin_len", &declassify::len(&pin));'''

[[case]]
id = "Y07-comparison-bit"
source = "positive: granted eq view (one bit)"
expect = "accept"
body = '''let same = declassify::eq(&pin, &pin);
    e.field("same", &Public::lit(if same { "yes" } else { "no" }));'''

[[case]]
id = "Y08-concat-publics"
source = "positive: combining public values"
expect = "accept"
body = '''e.field("greeting", &Public::lit("hi ").concat(&user));'''

[[case]]
id = "Y09-password-verify"
source = "positive: authentication outcome"
expect = "accept"
body = '''let h = crypto::password_hash(&password);
    let ok = crypto::password_verify(&password, &h);
    e.field("outcome", &Public::lit(if ok { "success" } else { "failure" }));'''

[[case]]
id = "Y10-generated-last-n"
source = "positive: precondition from generation"
expect = "accept"
body = '''let k = schema::generate_api_key();
    e.field("new_key_last4", &schema::last_n_api_key(&k));'''

[[case]]
id = "Y11-number"
source = "positive: public number"
expect = "accept"
body = '''e.field("n", &Public::num(42));'''

[[case]]
id = "Y12-digest-compare"
source = "positive: digest comparison bit"
expect = "accept"
body = '''let d1 = crypto::digest(&key);
    let d2 = crypto::digest(&key);
    e.field("match", &Public::lit(if crypto::digest_eq(&d1, &d2) { "yes" } else { "no" }));'''

[[case]]
id = "Y13-eq-with-granted"
source = "positive: granted cross-kind comparison (one bit)"
expect = "accept"
body = '''let by_email = declassify::eq_with(&identifier, &email);
    e.field("by_email", &Public::lit(if by_email { "yes" } else { "no" }));'''

[[case]]
id = "Y14-email-shape-check"
source = "positive: granted check view (email shape, one bit)"
expect = "accept"
body = '''let valid = declassify::is_email(&email);
    e.field("email_valid", &Public::lit(if valid { "yes" } else { "no" }));'''
