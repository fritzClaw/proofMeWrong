body = '''let v = {S}.chars(); e.field("n", &Public::num(v.len() as u64));'''

[[case]]
id = "B08-closure"
source = "codeql-step closure capture"
expect = "reject"
mutation = true
body = '''let f = || format!("{}", {S}); let _t = f();'''

[[case]]
id = "B09-display-impl"
source = "codeql-step error type with Display"
expect = "reject"
items = '''struct LeakErr { s: Secret<Password> }'''
outside = '''impl std::fmt::Display for LeakErr {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result { write!(f, "{:?}", self.s.inner) }
}'''
body = '''let _err = LeakErr { s: password };'''

[[case]]
id = "B10-hash-trait"
source = "codeql-step Hash (content extraction through a Hasher)"
expect = "reject"
mutation = true
body = '''{ use std::hash::{Hash, Hasher}; let mut h = std::collections::hash_map::DefaultHasher::new(); {S}.hash(&mut h); e.field("h", &Public::num(h.finish())); }'''

[[case]]
id = "B11-partial-eq"
source = "codeql-step comparison with a guessed value"
expect = "reject"
mutation = true
body = '''let guess = String::new(); let _b = {S} == guess;'''

[[case]]
id = "B12-as-ref-str"
source = "codeql-step AsRef<str> / Deref"
expect = "reject"
mutation = true
body = '''let r: &str = {S}.as_ref(); let _l = r.len();'''

# ------------------------------------------------------- bypass attempts

[[case]]
id = "C01-last-n-unchecked"
source = "bypass: declassifier precondition not proven (user-submitted key)"
expect = "reject"
body = '''e.field("key_last4", &schema::last_n_api_key(&key));'''

[[case]]
id = "C02-known-identifier-unproven"
source = "bypass: R7.4-style rule without matching identity"
expect = "reject"
body = '''e.field("identifier", &declassify::known_identifier(&identifier, &user));'''

[[case]]
id = "C03-known-identifier-wrong-match"
source = "bypass: identity matched against a different value"
expect = "reject"
body = '''if declassify::eq_public(&identifier, &Public::lit("admin")) {
        e.field("identifier", &declassify::known_identifier(&identifier, &user));
    }'''

[[case]]
id = "C04-view-not-granted-keyed-hash"
source = "bypass: declassifier not granted by the classification"
expect = "reject"
body = '''e.field("h", &crypto::keyed_hash(hk, &password));'''

[[case]]
id = "C05-view-not-granted-len"
source = "bypass: declassifier not granted by the classification"
expect = "reject"
body = '''e.field("n", &declassify::len(&password));'''

[[case]]
id = "C06-code-outside-verus"
source = "bypass: unverified code calls a declassifier without proof"
expect = "reject"
outside = '''fn sneaky(k: &Secret<ApiKey>) -> Public { schema::last_n_api_key(k) }'''
body = '''e.field("k", &Public::lit("x"));'''

[[case]]
id = "C07-external-body"
source = "bypass: unverified function claims a fact"
expect = "reject"
items = '''#[verifier::external_body]
fn trust_me(k: &Secret<ApiKey>)
    ensures k@.len() >= 4,
{
}'''
body = '''trust_me(&key); e.field("key_last4", &schema::last_n_api_key(&key));'''

[[case]]
id = "C08-assume"
source = "bypass: assume in proof code"
expect = "reject"
body = '''proof { assume(key@.len() >= 4); } e.field("key_last4", &schema::last_n_api_key(&key));'''

[[case]]
id = "C09-admit"
source = "bypass: admit in proof code"
expect = "reject"
items = '''proof fn lemma_len(k: Seq<char>)
    ensures k.len() >= 4,
{
    admit();
}'''
body = '''proof { lemma_len(key@); } e.field("key_last4", &schema::last_n_api_key(&key));'''

[[case]]
id = "C10-cfg-hiding"
source = "bypass: code visible to rustc but not to Verus"
expect = "reject"
items = '''#[cfg(not(verus_keep_ghost))]
fn tail(k: &Secret<ApiKey>) -> Public { schema::last_n_api_key(k) }
#[cfg(verus_keep_ghost)]
fn tail(k: &Secret<ApiKey>) -> Public { Public::lit("x") }'''
body = '''e.field("key_last4", &tail(&key));'''

